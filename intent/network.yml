# Source of truth for the whole lab.
# Every FRR config, the containerlab topology and every health-check expectation
# is generated from this file by `netpulse configs`. Edit here, never by hand.

lab_name: netlab

images:
  frr: quay.io/frrouting/frr:10.6.2
  host: nicolaka/netshoot:v0.16
  prometheus: prom/prometheus:v3.15.1
  grafana: grafana/grafana:12.4.15

mgmt:
  network: netlab-mgmt
  subnet: 172.20.20.0/24
  gateway: 172.20.20.1        # the Linux host itself; Prometheus scrapes the exporter here

settings:
  bfd: true                   # BFD on eBGP sessions and IS-IS adjacencies (300 ms x 3)
  mpls_ldp: true              # stretch goal: LDP between backbone routers
  ecmp_max_paths: 8
  exporter_port: 9101

# role decides which protocols a device runs:
#   leaf / spine : eBGP (RFC 7938 style)
#   backbone     : IS-IS + iBGP between loopbacks, eBGP to spines
#   pop          : OSPF over a GRE tunnel to the backbone
#   host         : plain Linux test host
devices:
  spine1:  {role: spine,    asn: 65100, loopback: 10.0.0.1,  mgmt_ip: 172.20.20.11}
  spine2:  {role: spine,    asn: 65100, loopback: 10.0.0.2,  mgmt_ip: 172.20.20.12}
  leaf1:   {role: leaf,     asn: 65101, loopback: 10.0.1.1,  mgmt_ip: 172.20.20.21}
  leaf2:   {role: leaf,     asn: 65102, loopback: 10.0.1.2,  mgmt_ip: 172.20.20.22}
  leaf3:   {role: leaf,     asn: 65103, loopback: 10.0.1.3,  mgmt_ip: 172.20.20.23}
  bb1:     {role: backbone, asn: 65000, loopback: 10.255.0.1, mgmt_ip: 172.20.20.31}
  bb2:     {role: backbone, asn: 65000, loopback: 10.255.0.2, mgmt_ip: 172.20.20.32}
  bb3:     {role: backbone, asn: 65000, loopback: 10.255.0.3, mgmt_ip: 172.20.20.33,
            tunnel_endpoint: 198.51.100.1}
  pop1:    {role: pop,      loopback: 10.255.1.1, mgmt_ip: 172.20.20.41,
            tunnel_endpoint: 198.51.100.2}
  host1:   {role: host, mgmt_ip: 172.20.20.51}
  host3:   {role: host, mgmt_ip: 172.20.20.53}
  hostpop: {role: host, mgmt_ip: 172.20.20.54}

# Point-to-point links use /31 (RFC 3021): both addresses are usable.
# The "a" side gets the first address of the subnet, the "b" side the second.
# type decides what runs on the link: fabric/edge -> eBGP, core -> IS-IS,
# internet -> only static routes for the tunnel endpoints, lan -> host subnet.
links:
  # leaf-spine fabric
  - {type: fabric, a: spine1:eth1, b: leaf1:eth1, subnet: 10.1.1.0/31}
  - {type: fabric, a: spine1:eth2, b: leaf2:eth1, subnet: 10.1.1.2/31}
  - {type: fabric, a: spine1:eth3, b: leaf3:eth1, subnet: 10.1.1.4/31}
  - {type: fabric, a: spine2:eth1, b: leaf1:eth2, subnet: 10.1.2.0/31}
  - {type: fabric, a: spine2:eth2, b: leaf2:eth2, subnet: 10.1.2.2/31}
  - {type: fabric, a: spine2:eth3, b: leaf3:eth2, subnet: 10.1.2.4/31}
  # spine <-> backbone (eBGP)
  - {type: edge, a: bb1:eth1, b: spine1:eth4, subnet: 10.2.0.0/31}
  - {type: edge, a: bb2:eth1, b: spine2:eth4, subnet: 10.2.0.2/31}
  # backbone triangle (IS-IS)
  - {type: core, a: bb1:eth2, b: bb2:eth2, subnet: 10.3.0.0/31}
  - {type: core, a: bb2:eth3, b: bb3:eth2, subnet: 10.3.0.2/31}
  - {type: core, a: bb1:eth3, b: bb3:eth1, subnet: 10.3.0.4/31}
  # "internet" link to the remote POP (documentation range RFC 5737)
  - {type: internet, a: bb3:eth3, b: pop1:eth1, subnet: 203.0.113.0/31}
  # host LANs: router gets .1, host gets .2
  - {type: lan, a: leaf1:eth3, b: host1:eth1, subnet: 192.168.11.0/24}
  - {type: lan, a: leaf3:eth3, b: host3:eth1, subnet: 192.168.13.0/24}
  - {type: lan, a: pop1:eth2, b: hostpop:eth1, subnet: 192.168.30.0/24}

# GRE runs between the tunnel_endpoint addresses (extra /32s on each loopback).
# OSPF runs only inside the tunnel. The endpoints are reached via static routes
# over the internet link and are NEVER advertised into OSPF: if the tunnel
# destination were learned through the tunnel itself we would get recursive
# routing and the tunnel would flap.
tunnels:
  - {name: gre1, a: bb3, b: pop1, subnet: 172.16.0.0/30, ospf_area: 0}

# End-to-end probes used by health checks, the exporter and chaos tests.
probes:
  - {src: host1, dst: host3}
  - {src: host1, dst: hostpop}
  - {src: host3, dst: hostpop}

# Guard rails for automatic remediation.
remediation:
  allowed_actions: [interface_no_shutdown, bgp_neighbor_no_shutdown, clear_bgp_session]
  max_actions_per_run: 3
  audit_log: logs/audit.jsonl
