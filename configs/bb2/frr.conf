frr version 10.6
frr defaults datacenter
hostname bb2
log file /tmp/frr.log informational
log timestamp precision 3
service integrated-vtysh-config
!
mpls ldp
 router-id 10.255.0.2
 !
 address-family ipv4
  discovery transport-address 10.255.0.2
  !
  interface eth2
  exit
  !
  interface eth3
  exit
  !
 exit-address-family
 !
exit
!
interface eth1
 description edge to spine2:eth4
 ip address 10.2.0.2/31
exit
!
interface eth2
 description core to bb1:eth2
 ip address 10.3.0.1/31
 ip router isis CORE
 isis bfd
 isis network point-to-point
exit
!
interface eth3
 description core to bb3:eth2
 ip address 10.3.0.2/31
 ip router isis CORE
 isis bfd
 isis network point-to-point
exit
!
interface lo
 ip address 10.255.0.2/32
 ip router isis CORE
 isis passive
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 neighbor EDGE peer-group
 neighbor EDGE bfd
 neighbor IBGP peer-group
 neighbor IBGP remote-as internal
 neighbor IBGP update-source lo
 neighbor 10.2.0.3 remote-as 65100
 neighbor 10.2.0.3 peer-group EDGE
 neighbor 10.2.0.3 description spine2
 neighbor 10.255.0.1 peer-group IBGP
 neighbor 10.255.0.1 description bb1
 neighbor 10.255.0.3 peer-group IBGP
 neighbor 10.255.0.3 description bb3
 !
 address-family ipv4 unicast
  neighbor EDGE route-map ALLOW-ALL in
  neighbor EDGE route-map ALLOW-ALL out
  neighbor IBGP next-hop-self
  maximum-paths 8
  maximum-paths ibgp 8
 exit-address-family
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0102.5500.0002.00
 log-adjacency-changes
exit
!
route-map ALLOW-ALL permit 10
exit
!
