frr version 10.6
frr defaults traditional
hostname r1
!
! 10.12.0.0/30: network .0, r1 .1, r2 .2, broadcast .3
interface eth1
 ip address 10.12.0.1/30
exit
!
interface lo
 ip address 1.1.1.1/32
exit
!
! r2's loopback is not directly connected, so r1 needs a route to it
ip route 2.2.2.2/32 10.12.0.2
!
